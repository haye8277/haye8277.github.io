<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">

  {% include head.html %}

  <body>

    <a class="skip-link" href="#main">Skip to content</a>

    <div class="scroll-progress" aria-hidden="true"></div>

    {% include header.html %}

    <main id="main" class="page-content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {% include footer.html %}

    <button id="back-to-top" aria-label="Back to top">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
    </button>

    <script>
      (function() {
        var root = document.documentElement;
        var btn = document.getElementById('back-to-top');
        var bar = document.querySelector('.scroll-progress');
        var header = document.querySelector('.site-header');
        var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Header state, back-to-top and reading progress
        btn.addEventListener('click', function() {
          window.scrollTo({top: 0, behavior: reduceMotion ? 'auto' : 'smooth'});
        });
        function onScroll() {
          var max = root.scrollHeight - window.innerHeight;
          bar.style.transform = 'scaleX(' + (max > 0 ? window.scrollY / max : 0) + ')';
          btn.classList.toggle('visible', window.scrollY > 600);
          header.classList.toggle('scrolled', window.scrollY > 10);
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();

        // Light / dark switch. The site follows the system until the visitor picks;
        // picking the system's own theme hands control back to it.
        var toggle = document.querySelector('.theme-toggle');
        var darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
        var tints = document.querySelectorAll('meta[name="theme-color"]');
        function currentTheme() {
          return root.getAttribute('data-theme') || (darkQuery.matches ? 'dark' : 'light');
        }
        function syncTheme() {
          var picked = root.getAttribute('data-theme');
          toggle.setAttribute('aria-label', 'Switch to ' + (currentTheme() === 'dark' ? 'light' : 'dark') + ' theme');
          // browser chrome follows the picked theme too
          if (tints.length === 2) {
            tints[0].content = picked === 'dark' ? '#0b1016' : '#f7fafb';
            tints[1].content = picked === 'light' ? '#f7fafb' : '#0b1016';
          }
        }
        function applyTheme(next) {
          var follows = next === (darkQuery.matches ? 'dark' : 'light');
          if (follows) root.removeAttribute('data-theme'); else root.setAttribute('data-theme', next);
          try {
            if (follows) localStorage.removeItem('jh-theme'); else localStorage.setItem('jh-theme', next);
          } catch (e) {}
          syncTheme();
        }
        if (toggle) {
          toggle.hidden = false;
          syncTheme();
          if (darkQuery.addEventListener) darkQuery.addEventListener('change', syncTheme);
          var queued = null; // the theme a sweep is still on its way to
          var sweep = null;  // the sweep in charge right now
          toggle.addEventListener('click', function() {
            var next = (queued || currentTheme()) === 'dark' ? 'light' : 'dark';
            if (!document.startViewTransition || reduceMotion) { applyTheme(next); return; }
            // the new theme sweeps out in a circle from the switch
            var box = toggle.getBoundingClientRect();
            var x = box.left + box.width / 2, y = box.top + box.height / 2;
            root.style.setProperty('--tx', x + 'px');
            root.style.setProperty('--ty', y + 'px');
            root.style.setProperty('--tr', Math.hypot(Math.max(x, window.innerWidth - x), Math.max(y, window.innerHeight - y)) + 'px');
            root.classList.add('theme-switching');
            queued = next;
            var run = document.startViewTransition(function() {
              applyTheme(next);
              if (sweep === run) queued = null;
            });
            sweep = run;
            var settle = function() {
              if (sweep !== run) return; // a newer sweep took over
              sweep = null;
              root.classList.remove('theme-switching');
            };
            run.finished.then(settle, settle);
            // a sweep cut short by a second click is fine, not an error
            if (run.ready) run.ready.catch(function() {});
            // never leave the choice waiting on a frame that isn't coming
            setTimeout(function() {
              if (sweep === run && queued === next && run.skipTransition) run.skipTransition();
            }, 1000);
          });
        }

        // Re-sign the monogram each time the logo is hovered
        var brand = document.querySelector('.brand');
        var mono = brand && brand.querySelector('.monogram');
        if (mono && !reduceMotion) {
          brand.addEventListener('mouseenter', function() {
            mono.classList.remove('is-redrawing');
            mono.getBoundingClientRect();
            mono.classList.add('is-redrawing');
          });
        }

        // Cursor spotlight on cards
        document.querySelectorAll('.spot').forEach(function(card) {
          card.addEventListener('pointermove', function(e) {
            var r = card.getBoundingClientRect();
            card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
            card.style.setProperty('--my', (e.clientY - r.top) + 'px');
          });
        });

        if (reduceMotion || !('IntersectionObserver' in window)) {
          root.classList.add('no-motion');
          return;
        }

        // Park the looping animations while their section is off screen (easier on phone batteries)
        var parker = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) { entry.target.classList.toggle('is-parked', !entry.isIntersecting); });
        }, { rootMargin: '80px 0px' });
        document.querySelectorAll('.hero-photo, .marquee, .now, .stats, .featured-post, .project-visual, .about-photo, .flyby-lane, .story-head, .cta-block, .lost-droid').forEach(function(el) { parker.observe(el); });

        // Count up numbers marked with data-count
        function countUp(el) {
          var target = parseFloat(el.getAttribute('data-count'));
          var start = null;
          function step(t) {
            if (!start) start = t;
            var p = Math.min((t - start) / 1400, 1);
            var eased = 1 - Math.pow(1 - p, 3);
            el.textContent = Math.round(target * eased);
            if (p < 1) requestAnimationFrame(step);
          }
          requestAnimationFrame(step);
        }

        // Reveal elements as they scroll into view, staggered within each group
        var targets = document.querySelectorAll('.section-head, .stat, .skill-card, .work-item, .post-card, .cta-block, .project-card, .blog-row, .year-label, .story-head, .story-body > *, .career-path li, .step, .featured-post, .post-content > *, .fact, .now-item, .signature, .project-index, .climb');
        var io = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (!entry.isIntersecting) return;
            var el = entry.target;
            el.classList.add('is-visible');
            io.unobserve(el);
            var steps = el.closest('.steps');
            if (steps) steps.classList.add('is-drawn');
            // hand-drawn bits draw themselves once their section shows up
            el.querySelectorAll('.scribble-circle, .lets-talk, .doodle, .climb-line').forEach(function(d) { d.classList.add('is-drawn'); });
            el.querySelectorAll('[data-count]').forEach(countUp);
            // Hand the element back to its own hover transitions once it has landed
            setTimeout(function() {
              el.classList.remove('reveal', 'is-visible');
              el.style.transitionDelay = '';
            }, 1700 + parseInt(el.style.transitionDelay || 0, 10));
          });
        }, { rootMargin: '0px 0px -60px 0px' });
        targets.forEach(function(el) {
          var index = Array.prototype.indexOf.call(el.parentNode.children, el);
          el.style.transitionDelay = Math.min(index, 5) * 80 + 'ms';
          el.style.setProperty('--i', Math.min(index, 5)); // doodles inside draw in the same order
          el.classList.add('reveal');
          io.observe(el);
        });
      })();
    </script>

  </body>

</html>
