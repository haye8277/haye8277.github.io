<!DOCTYPE html>
<html lang="en">

  {% include head.html %}

  <body>

    <a class="skip-link" href="#main">Skip to content</a>

    <div class="scroll-progress" aria-hidden="true"></div>

    {% include header.html %}

    <main id="main" class="page-content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {% include footer.html %}

    <button id="back-to-top" aria-label="Back to top">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
    </button>

    <script>
      (function() {
        var root = document.documentElement;
        var btn = document.getElementById('back-to-top');
        var header = document.querySelector('.site-header');
        var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Header state, back-to-top and reading progress
        btn.addEventListener('click', function() {
          window.scrollTo({top: 0, behavior: reduceMotion ? 'auto' : 'smooth'});
        });
        function onScroll() {
          var max = root.scrollHeight - window.innerHeight;
          root.style.setProperty('--progress', max > 0 ? window.scrollY / max : 0);
          btn.classList.toggle('visible', window.scrollY > 600);
          header.classList.toggle('scrolled', window.scrollY > 10);
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();

        // Cursor spotlight on cards
        document.querySelectorAll('.spot').forEach(function(card) {
          card.addEventListener('pointermove', function(e) {
            var r = card.getBoundingClientRect();
            card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
            card.style.setProperty('--my', (e.clientY - r.top) + 'px');
          });
        });

        if (reduceMotion || !('IntersectionObserver' in window)) {
          root.classList.add('no-motion');
          return;
        }

        // Count up numbers marked with data-count
        function countUp(el) {
          var target = parseFloat(el.getAttribute('data-count'));
          var start = null;
          function step(t) {
            if (!start) start = t;
            var p = Math.min((t - start) / 1400, 1);
            var eased = 1 - Math.pow(1 - p, 3);
            el.textContent = Math.round(target * eased);
            if (p < 1) requestAnimationFrame(step);
          }
          requestAnimationFrame(step);
        }

        // Reveal elements as they scroll into view, staggered within each group
        var targets = document.querySelectorAll('.section-head, .stat, .skill-card, .work-item, .post-card, .cta-block, .project-card, .blog-row, .year-label, .story-head, .story-body > *, .step, .featured-post, .post-content > *, .fact, .now-item, .signature');
        var io = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (!entry.isIntersecting) return;
            var el = entry.target;
            el.classList.add('is-visible');
            io.unobserve(el);
            var steps = el.closest('.steps');
            if (steps) steps.classList.add('is-drawn');
            el.querySelectorAll('[data-count]').forEach(countUp);
            // Hand the element back to its own hover transitions once it has landed
            setTimeout(function() {
              el.classList.remove('reveal', 'is-visible');
              el.style.transitionDelay = '';
            }, 1700 + parseInt(el.style.transitionDelay || 0, 10));
          });
        }, { rootMargin: '0px 0px -60px 0px' });
        targets.forEach(function(el) {
          var index = Array.prototype.indexOf.call(el.parentNode.children, el);
          el.style.transitionDelay = Math.min(index, 5) * 80 + 'ms';
          el.classList.add('reveal');
          io.observe(el);
        });
      })();
    </script>

  </body>

</html>
