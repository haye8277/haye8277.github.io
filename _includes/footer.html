<footer class="site-footer">
  <div class="wrapper">

    <div class="footer-top">
      <div>
        <p class="footer-statement">Marketing, projects and the occasional <em>side quest</em>.</p>
        <p class="signature" aria-label="Signed, Jacob">Jacob</p>
      </div>
      <a class="footer-email" href="mailto:{{ site.email }}">{{ site.email | downcase }} <span aria-hidden="true">&#8599;</span></a>
    </div>

    <div class="footer-bottom">
      <p class="footer-copyright">&copy; {{ site.time | date: "%Y" }} Jacob Hayes &middot; Hand-built with Jekyll &middot; kneejar.com since 2016</p>

      <nav class="footer-links" aria-label="Elsewhere">
        {% if site.github_username %}<a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">GitHub</a>{% endif %}
        {% if site.linkedin_url %}<a href="{{ site.linkedin_url }}" target="_blank" rel="noopener">LinkedIn</a>{% endif %}
        <a href="https://soundcloud.com/knee-jar" target="_blank" rel="noopener">SoundCloud</a>
        <a href="{{ "/feed.xml" | prepend: site.baseurl }}">RSS</a>
      </nav>
    </div>

  </div>
</footer>
